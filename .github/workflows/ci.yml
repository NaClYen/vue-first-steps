name: CI

on:
  push:
    branches: [main]
  pull_request:

defaults:
  run:
    working-directory: maintainers

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: maintainers/package-lock.json
      - run: npm ci
        env:
          PLAYWRIGHT_SKIP_BROWSER_DOWNLOAD: '1'
      # 每步四項檢查：.vue 可編譯、連結來回一致、starter = 上一步 solution、vitest 測試
      - run: npm run check
      - run: npm run build

  browser:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: maintainers/package-lock.json
      - run: npm ci
        env:
          PLAYWRIGHT_SKIP_BROWSER_DOWNLOAD: '1'
      - run: npx playwright-core install --with-deps chromium
      # 單檔 HTML 備案：斷網、file:// 下要能動
      - run: npm run test:browser
